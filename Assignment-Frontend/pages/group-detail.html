<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grup Detayı</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <div class="logo">Ödev Sistemi</div>
    <nav id="mainNav">
      <ul>
        <!-- Navigation links will be dynamically loaded here -->
      </ul>
    </nav>
  </header>

  <section class="dashboard" id="groupDetailPage">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 id="groupNameTitle">Grup Detayı</h1>
      <button onclick="window.history.back()" class="btn-secondary">← Geri</button>
    </div>

    <div id="groupInfo" style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
      <p id="assignmentTitle" style="color: #666; margin-bottom: 0.5rem;"></p>
      <h2 id="groupName" style="margin-bottom: 1rem;"></h2>
      <div id="statusBadge"></div>
    </div>

    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
      <h2 style="margin-bottom: 1.5rem;">Grup Üyeleri (<span id="memberCount">0</span>)</h2>
      <div id="membersList"></div>
    </div>

    <div style="background: white; padding: 2rem; border-radius: 12px; margin-top: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
      <h2 style="margin-bottom: 1.5rem;">Grup Bilgileri</h2>
      <div id="groupDetails"></div>
    </div>
  </section>

  <script src="authUtils.js"></script>
  <script src="navigation.js"></script>
  <script src="group-detail.js"></script>
</body>
</html>
