<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Oluştur - Ödev Sistemi</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <div class="logo">🎓 Ödev Sistemi</div>
    <nav>
      <ul>
        <!-- Navigation.js tarafından dinamik olarak doldurulacak -->
      </ul>
    </nav>
  </header>

  <!-- Mobil Header -->
  <div class="mobile-header" style="display: flex;">
    <div class="mobile-header-left">
      <a href="javascript:history.back()" class="mobile-header-icon" style="margin-right: 12px;">←</a>
      <div class="mobile-header-greeting">📅 Yeni Schedule</div>
    </div>
  </div>

  <section class="dashboard content-with-bottom-nav" id="createSchedulePage">
    <!-- Class Info Box -->
    <div id="classInfoBox" style="background: var(--background-secondary); padding: 0.75rem; margin: 0.75rem; border-radius: 12px; border: 1px solid var(--border);">
      <p id="classInfoText" style="font-weight: 600; color: var(--text-primary); margin: 0; font-size: 0.9rem;">📚 Sınıf</p>
    </div>

    <!-- Form -->
    <form id="createScheduleForm" style="padding: 0.75rem;">
      <!-- Day of Week -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Gün *</label>
        <div id="daysContainer" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
          <!-- Günler JavaScript ile eklenecek -->
        </div>
      </div>

      <!-- Start Time -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Başlangıç Saati * (HH:mm)</label>
        <input type="text" id="startTime" placeholder="09:00" required 
               style="width: 100%; padding: 0.5rem; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem;"
               pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$">
        <small style="color: var(--text-secondary); font-size: 0.75rem; display: block; margin-top: 0.25rem;">Örnek: 09:00, 14:30</small>
      </div>

      <!-- End Time -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Bitiş Saati * (HH:mm)</label>
        <input type="text" id="endTime" placeholder="10:30" required 
               style="width: 100%; padding: 0.5rem; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem;"
               pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$">
        <small style="color: var(--text-secondary); font-size: 0.75rem; display: block; margin-top: 0.25rem;">Örnek: 10:30, 16:00</small>
      </div>

      <!-- Room Number -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Oda Numarası</label>
        <input type="text" id="roomNumber" placeholder="A-101" 
               style="width: 100%; padding: 0.5rem; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem;">
      </div>

      <!-- Building -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Bina</label>
        <input type="text" id="building" placeholder="A Blok" 
               style="width: 100%; padding: 0.5rem; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem;">
      </div>

      <!-- Notes -->
      <div class="form-section" style="margin-bottom: 0.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">Notlar</label>
        <textarea id="notes" placeholder="Ek notlar..." rows="3" 
                  style="width: 100%; padding: 0.5rem; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem; font-family: inherit; resize: vertical;"></textarea>
      </div>

      <!-- ✅ KALDIRILDI: Is Active checkbox kaldırıldı - Schedule'lar her zaman aktif oluşturulacak -->

      <!-- Result -->
      <div id="createScheduleResult" style="margin-top: 0.75rem;"></div>

      <!-- Submit Button -->
      <button type="submit" id="createScheduleSubmitBtn" class="btn-primary" style="width: 100%; padding: 0.6rem; margin-top: 0.75rem; font-size: 0.9rem; font-weight: 600;">
        Schedule Oluştur
      </button>
    </form>
  </section>

  <!-- Alt Tab Bar -->
  <div class="bottom-nav">
    <a href="teacher_dashboard.html" class="bottom-nav-item">
      <div class="bottom-nav-icon">🏠</div>
      <div class="bottom-nav-label">Ana Sayfa</div>
    </a>
    <a href="assignments.html" class="bottom-nav-item">
      <div class="bottom-nav-icon">📝</div>
      <div class="bottom-nav-label">Ödevler</div>
    </a>
    <a href="class_management.html" class="bottom-nav-item">
      <div class="bottom-nav-icon">👥</div>
      <div class="bottom-nav-label">Öğrenciler</div>
    </a>
    <a href="profile.html" class="bottom-nav-item">
      <div class="bottom-nav-icon">👤</div>
      <div class="bottom-nav-label">Profil</div>
    </a>
  </div>

  <footer>
    <p>&copy; 2025 Ödev Sistemi</p>
  </footer>

  <script src="authUtils.js"></script>
  <script src="navigation.js"></script>
  <script src="createSchedule.js"></script>
</body>
</html>
