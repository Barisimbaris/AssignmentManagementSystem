<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ders Programı</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <div class="logo">🎓 Ödev Sistemi</div>
    <nav>
      <ul>
        <!-- Navigation menüsü navigation.js tarafından doldurulacak -->
      </ul>
    </nav>
  </header>

  <main class="schedule-container">
    <div class="schedule-header">
      <h1>📅 Ders Programım</h1>
    </div>

    <div id="loadingIndicator" class="loading-placeholder">
      <div class="loading-spinner"></div>
      <p>Ders programı yükleniyor...</p>
    </div>

    <div id="scheduleContent" class="schedule-content" style="display: none;">
      <!-- Ders Programları -->
      <div class="section" style="margin-bottom: 2rem;">
        <h2 style="margin-bottom: 1rem;">📅 Haftalık Ders Programı</h2>
        <div id="schedulesList" class="schedules-list">
          <!-- Schedule'lar buraya eklenecek -->
        </div>
      </div>

      <!-- Ödevler -->
      <div class="section" style="margin-bottom: 2rem;">
        <h2 style="margin-bottom: 1rem;">📝 Ödevlerim</h2>
        <div id="assignmentsList" class="assignments-list">
          <!-- Assignment'lar buraya eklenecek -->
        </div>
      </div>

      <!-- Sınıf listesi -->
      <div class="classes-summary">
        <h2>📚 Kayıtlı Olduğum Dersler</h2>
        <div id="classesList" class="classes-grid"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">📅</div>
      <h3 id="emptyTitle">Henüz ders programı bulunmuyor</h3>
      <p id="emptyText">Kayıtlı olduğunuz sınıflar için ders planları henüz eklenmemiş.</p>
    </div>

    <div id="errorState" class="error-state" style="display: none;">
      <div class="error-icon">⚠️</div>
      <h3>Bir hata oluştu</h3>
      <p id="errorMessage"></p>
      <button onclick="location.reload()" class="btn-primary">Yeniden Dene</button>
    </div>
  </main>

  <script src="authUtils.js"></script>
  <script src="navigation.js"></script>
  <script src="classSchedule.js"></script>
</body>
</html>
